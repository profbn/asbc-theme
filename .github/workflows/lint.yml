name: Verificar sintaxe do tema

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Conferir PHP
        run: |
          php --version
          find . -path './.git' -prune -o -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Conferir JavaScript
        run: |
          node --version
          find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
